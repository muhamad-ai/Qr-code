<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ڕیستۆرانتی یادی گەشتیاری — مینیو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@400;500;600;700;800&family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --char-black:#1a1613;
    --char-black-2:#221c18;
    --smoke:#3d3530;
    --ember:#c1440e;
    --flame:#e8622c;
    --brass:#d4a24c;
    --cream:#f2e9dc;
    --cream-dim:#cfc2ac;
    --line:rgba(212,162,76,0.25);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse at 50% -10%, rgba(232,98,44,0.18), transparent 60%),
      var(--char-black);
    color:var(--cream);
    font-family:'Vazirmatn', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
  }

  /* char-grate texture strip */
  .grate{
    height:10px;
    background: repeating-linear-gradient(90deg, var(--brass) 0 3px, transparent 3px 14px);
    opacity:0.35;
  }

  /* HERO */
  .hero{
    position:relative;
    padding:64px 20px 48px;
    text-align:center;
    overflow:hidden;
    border-bottom:1px solid var(--line);
  }
  .hero::before{
    content:"";
    position:absolute; inset:0;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(232,98,44,0.10) 0, transparent 40%),
      radial-gradient(circle at 80% 70%, rgba(193,68,14,0.14) 0, transparent 45%);
    pointer-events:none;
  }
  .skewer-row{
    display:flex; justify-content:center; align-items:center; gap:14px; margin-bottom:18px;
  }
  .deco-dot{
    width:6px; height:6px; border-radius:50%;
    background:var(--brass); opacity:0.8;
  }
  .deco-flame{ font-size:22px; line-height:1; }
  .eyebrow{
    font-family:'Vazirmatn', sans-serif;
    font-size:13px; letter-spacing:2px; color:var(--brass);
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .hero h1{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-weight:700;
    font-size:clamp(38px, 9vw, 64px);
    line-height:1.05;
    background:linear-gradient(180deg, var(--cream) 20%, var(--brass) 100%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
    margin-bottom:14px;
  }
  .hero p.tag{
    color:var(--cream-dim);
    font-size:16px;
    max-width:420px;
    margin:0 auto;
  }
  .logo-wrap{
    width:100%;
    text-align:center;
    margin-bottom:20px;
  }
  .restaurant-logo{
    display:block;
    width:100%;
    max-width:700px;
    height:auto;
    margin:0 auto;
  }

  /* MENU */
  .menu{ max-width:640px; margin:0 auto; padding:44px 18px 0; }
  .category{ margin-bottom:46px; }
  .cat-head{
    display:flex; align-items:center; gap:12px;
    margin-bottom:18px;
  }
  .cat-icon{
    width:10px; height:10px; flex:0 0 auto;
    border-radius:50%;
    background:var(--flame);
    box-shadow:0 0 10px 2px rgba(232,98,44,0.55);
  }
  .cat-head h2{
    font-family:'Noto Kufi Arabic', sans-serif;
    font-size:24px; font-weight:600; color:var(--cream);
  }
  .cat-head .cat-sub{
    font-family:'Vazirmatn', sans-serif;
    font-size:11px; color:var(--cream-dim); margin-top:2px;
  }
  .cat-rule{ flex:1; height:1px; background:var(--line); }

  .item{
    display:flex; justify-content:space-between; align-items:center;
    gap:14px;
    padding:16px 2px;
    border-bottom:1px dashed var(--line);
  }
  .item:last-child{ border-bottom:none; }
  .item-name{
    font-size:19px; font-weight:600; color:var(--cream);
  }
  .item-price{
    font-family:'Vazirmatn', sans-serif;
    font-weight:700; font-size:17px; color:var(--brass);
    white-space:nowrap;
  }

  /* FOOTER NOTE */
  .footer-note{
    text-align:center; margin-top:50px; padding:0 20px;
    color:var(--cream-dim); font-size:12px;
    font-family:'Vazirmatn', sans-serif;
  }

  /* ============ ANIMATIONS ============ */

  /* floating embers in the hero */
  .ember-particle{
    position:absolute;
    bottom:-10px;
    width:4px; height:4px;
    border-radius:50%;
    background:var(--flame);
    box-shadow:0 0 6px 2px rgba(232,98,44,0.7);
    opacity:0;
    animation:rise 6s ease-in infinite;
    pointer-events:none;
  }
  @keyframes rise{
    0%{ transform:translateY(0) translateX(0); opacity:0; }
    10%{ opacity:1; }
    90%{ opacity:0.6; }
    100%{ transform:translateY(-260px) translateX(var(--drift,10px)); opacity:0; }
  }

  /* hero entrance */
  .logo-wrap{ opacity:0; animation:fadeUp .9s ease forwards; }
  .hero h1{ opacity:0; animation:fadeUp .9s ease forwards; animation-delay:.15s; }
  .hero p.tag{ opacity:0; animation:fadeUp .9s ease forwards; animation-delay:.28s; }
  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  /* gentle logo pulse */
  .restaurant-logo{ animation:logoPulse 5s ease-in-out infinite; }
  @keyframes logoPulse{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(232,98,44,0)); }
    50%{ filter:drop-shadow(0 0 14px rgba(232,98,44,0.35)); }
  }

  /* category scroll-reveal */
  .category{
    opacity:0;
    transform:translateY(24px);
    transition:opacity .7s ease, transform .7s ease;
  }
  .category.in-view{
    opacity:1;
    transform:translateY(0);
  }

  /* item row hover / stagger */
  .item{
    transition:background .25s ease, padding-right .25s ease;
  }
  .item:hover{
    background:rgba(232,98,44,0.06);
    padding-right:8px;
    border-radius:8px;
  }
  .item:hover .item-price{
    text-shadow:0 0 10px rgba(212,162,76,0.6);
  }
  .item-price{ transition:text-shadow .25s ease; }

  /* cat icon gentle glow pulse */
  .cat-icon{ animation:iconPulse 2.4s ease-in-out infinite; }
  @keyframes iconPulse{
    0%,100%{ box-shadow:0 0 10px 2px rgba(232,98,44,0.55); }
    50%{ box-shadow:0 0 16px 4px rgba(232,98,44,0.85); }
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap, .hero h1, .hero p.tag, .category, .restaurant-logo, .cat-icon, .ember-particle{
      animation:none !important;
      transition:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }
</style>
</head>
<body>

<div class="hero">
  <span class="ember-particle" style="left:20%; animation-delay:0s; --drift:14px;"></span>
  <span class="ember-particle" style="left:45%; animation-delay:1.8s; --drift:-10px;"></span>
  <span class="ember-particle" style="left:65%; animation-delay:3.2s; --drift:8px;"></span>
  <span class="ember-particle" style="left:80%; animation-delay:.9s; --drift:-14px;"></span>
  <div class="logo-wrap"><img src="images/logo.png" alt="Logo" class="restaurant-logo"></div>
  <h1>ڕیستۆرانتی یادی گەشتیاری</h1>
  <div class="ember-line"></div>
</div>

<div class="menu">

  <div class="category">
    <div class="cat-head">
      <div class="cat-icon"></div>
      <div>
        <h2>قۆزی</h2>
      </div>
      <div class="cat-rule"></div>
    </div>

    <div class="item">
      <div class="item-name">قۆزی</div>
      <div class="item-price">٢٠٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">نیوقۆزی</div>
      <div class="item-price">١٠٬٠٠٠ دینار</div>
    </div>
  </div>

  <div class="category">
    <div class="cat-head">
      <div class="cat-icon"></div>
      <div>
        <h2>کوڵاو و برژاو</h2>
      </div>
      <div class="cat-rule"></div>
    </div>

    <div class="item">
      <div class="item-name">کوڵاو</div>
      <div class="item-price">٨٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">کەباب</div>
      <div class="item-price">٦٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">گۆشت</div>
      <div class="item-price">٥٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">سنگ</div>
      <div class="item-price">٥٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">سادە</div>
      <div class="item-price">٤٬٠٠٠ دینار</div>
    </div>
    <div class="item">
      <div class="item-name">جگەر</div>
      <div class="item-price">٥٬٠٠٠ دینار</div>
    </div>
  </div>

</div>

<div class="footer-note">
  ڕیستۆرانتی یادی گەشتیاری — بەخێربێن بۆ تامی ڕاستەقینەی خواردن
</div>

<script>
  const cats = document.querySelectorAll('.category');
  const observer = new IntersectionObserver((entries) => {
    entries.forEach((entry, i) => {
      if (entry.isIntersecting) {
        setTimeout(() => entry.target.classList.add('in-view'), i * 80);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.15 });
  cats.forEach(cat => observer.observe(cat));
</script>

</body>
</html>
